# NOTE: this is the FALLBACK boot path — bootcmd runs nerves_boot from the
# Nerves environment and U-Boot's distro boot only reaches this extlinux
# config if that environment is missing or corrupt.
# extlinux configuration booting firmware slot A
#
# Firmware upgrades swap this file between the slot A and slot B variants —
# only the kernel name and root= differ.
#
# ttyS0 is the debug UART (UART0, 115200 baud, the 3-pin debug header).
# root= is the fixed MBR partition; the mmc0 alias in the device tree pins
# the SD card to mmcblk0 regardless of probe order.
DEFAULT nerves-a
TIMEOUT 10

LABEL nerves-a
    KERNEL /Image.a
    FDT /sun50i-h618-kickpi-k2b.a.dtb
    APPEND console=ttyS0,115200 console=tty1 root=/dev/mmcblk0p2 rootfstype=squashfs rootwait
