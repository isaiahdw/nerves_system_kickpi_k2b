name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Lightweight checks that don't require the Buildroot toolchain: dependency
# resolution and formatting. Running nerves_system_linter or catching build
# breaks needs a full system build in the ghcr.io/nerves-project/nerves_system_br
# container (a much longer job), which is intentionally not wired up here.
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted
